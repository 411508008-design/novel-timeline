<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小說家靈感時序庫 - Google 雲端版</title>
  <!-- Tailwind CSS -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 md:p-8 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Top Sync & Cloud Header -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 md:p-6 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">
              小說家時序工作台
            </span>
            <h1 class="text-2xl font-bold tracking-tight text-[var(--foreground)]">小說靈感時序庫</h1>
          </div>
          <p class="text-xs md:text-sm text-[var(--muted-foreground)] mt-1">
            捕捉零散場面靈感，自動排列時序與計算人物年齡，資料直連個人 Google Drive
          </p>
        </div>

        <!-- Google Drive Connection Status & Button -->
        <div class="flex items-center gap-2 flex-wrap">
          <div id="cloudStatusBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-500/10 text-amber-600 border border-amber-500/20">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            <span id="cloudStatusText">未登入 (目前儲存於瀏覽器本機)</span>
          </div>

          <button id="googleAuthBtn" onclick="handleAuthClick()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
            </svg>
            <span id="googleAuthBtnText">登入 Google 雲端同步</span>
          </button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center justify-between pt-2 border-t border-[var(--border)] gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <button onclick="openAddModal()" class="px-3.5 py-1.5 bg-[var(--primary)] text-[var(--primary-foreground)] rounded-lg font-medium text-xs hover:opacity-90 transition shadow-xs flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            記錄新靈感碎片
          </button>
          <button onclick="openCharModal()" class="px-3 py-1.5 border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--accent)] text-[var(--foreground)] rounded-lg font-medium text-xs transition">
            ⚙️ 管理角色與出生年
          </button>
        </div>

        <div class="flex items-center gap-2 text-xs">
          <button onclick="syncToCloud(true)" class="px-2.5 py-1.5 border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] rounded-md transition flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            立即儲存
          </button>
          <button onclick="exportData()" class="px-2.5 py-1.5 border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] rounded-md transition">
            備份 JSON
          </button>
        </div>
      </div>
    </header>

    <!-- Character Info & POV Filter Bar -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-bold text-[var(--muted-foreground)]">人物年齡推算基準：</span>
        <div class="flex flex-wrap gap-1.5" id="characterList">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="flex items-center gap-2">
        <label class="text-xs text-[var(--muted-foreground)] whitespace-nowrap">視角切換：</label>
        <select id="povFilter" onchange="filterByPOV()" class="text-xs bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] rounded-md px-2.5 py-1.5 focus:outline-none">
          <option value="ALL">全域時間線 (所有碎片)</option>
        </select>
      </div>
    </div>

    <!-- Timeline Area -->
    <div class="relative pt-2">
      <div class="absolute left-6 md:left-8 top-4 bottom-4 w-0.5 bg-[var(--border)]"></div>
      <div id="timelineList" class="space-y-4 relative">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <!-- Fragment Add/Edit Modal -->
  <div id="fragmentModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-base font-bold text-[var(--foreground)]" id="modalTitle">記錄靈感碎片</h3>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">碎片標題 / 核心場面</label>
          <input type="text" id="fragTitle" placeholder="例如：雪夜破廟中的斷劍訣別" class="w-full bg-[var(--background)] border border-[var(--border)] rounded-lg px-3 py-2 text-sm text-[var(--foreground)] focus:ring-1 focus:ring-[var(--primary)] outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">發生年份 / 曆法年</label>
            <input type="number" id="fragYear" placeholder="例如：1024" class="w-full bg-[var(--background)] border border-[var(--border)] rounded-lg px-3 py-2 text-sm text-[var(--foreground)] focus:ring-1 focus:ring-[var(--primary)] outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">粗略時期標籤 (選填)</label>
            <input type="text" id="fragEra" placeholder="例如：少年遊歷期 / 京城之亂" class="w-full bg-[var(--background)] border border-[var(--border)] rounded-lg px-3 py-2 text-sm text-[var(--foreground)] focus:ring-1 focus:ring-[var(--primary)] outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">登場角色 (逗號分隔)</label>
          <input type="text" id="fragCharacters" placeholder="例如：林淵, 師尊, 蘇離" class="w-full bg-[var(--background)] border border-[var(--border)] rounded-lg px-3 py-2 text-sm text-[var(--foreground)] focus:ring-1 focus:ring-[var(--primary)] outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">靈感描述 / 對白 / 備註</label>
          <textarea id="fragContent" rows="3" placeholder="記下當時浮現的強烈對白、氣氛、心境或這場戲的伏筆..." class="w-full bg-[var(--background)] border border-[var(--border)] rounded-lg px-3 py-2 text-sm text-[var(--foreground)] focus:ring-1 focus:ring-[var(--primary)] outline-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-[var(--border)]">
        <button onclick="closeModal('fragmentModal')" class="px-4 py-2 border border-[var(--border)] rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:bg-[var(--accent)]">取消</button>
        <button onclick="saveFragment()" class="px-4 py-2 bg-[var(--primary)] text-[var(--primary-foreground)] rounded-lg text-xs font-semibold shadow-xs hover:opacity-90">儲存碎片</button>
      </div>
    </div>
  </div>

  <!-- Character Manage Modal -->
  <div id="charModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-base font-bold text-[var(--foreground)]">管理角色出生年份</h3>
      <p class="text-xs text-[var(--muted-foreground)]">輸入角色與其出生年份，時間線會自動在每個事件推算角色的年齡，防止吃書！</p>
      
      <div class="space-y-3" id="charInputsList">
        <!-- populated dynamically -->
      </div>

      <div class="flex items-center gap-2 pt-2">
        <input type="text" id="newCharName" placeholder="新角色名字" class="w-1/2 bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-xs text-[var(--foreground)]">
        <input type="number" id="newCharBirth" placeholder="出生年份" class="w-1/3 bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-xs text-[var(--foreground)]">
        <button onclick="addNewChar()" class="px-3 py-1.5 bg-[var(--secondary)] text-[var(--secondary-foreground)] rounded-lg text-xs font-semibold hover:opacity-90">新增</button>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-[var(--border)]">
        <button onclick="closeModal('charModal')" class="px-4 py-2 bg-[var(--primary)] text-[var(--primary-foreground)] rounded-lg text-xs font-semibold">完成</button>
      </div>
    </div>
  </div>

  <script>
    // --- Configuration ---
    const GOOGLE_CLIENT_ID = "109757978370-4jnsqcg3cfvv1s2b0ubbagq97a0oi3ig.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/drive.file";
    const FOLDER_NAME = "小說時序庫";
    const FILE_NAME = "novel_timeline_data.json";

    // --- State ---
    let accessToken = null;
    let driveFolderId = null;
    let driveFileId = null;
    let tokenClient = null;

    let appData = {
      characters: {
        "林淵": { birthYear: 1010 },
        "雲滄(師尊)": { birthYear: 980 },
        "蘇離(皇女)": { birthYear: 1013 }
      },
      fragments: [
        {
          id: "1",
          year: 1018,
          era: "童年時期",
          title: "大雪夜拜師",
          characters: ["林淵", "雲滄(師尊)"],
          content: "林淵八歲孤身在山門外跪了三天三夜，雲滄收下他，贈他未開鋒的木劍。"
        },
        {
          id: "2",
          year: 1026,
          era: "少年下山",
          title: "第一次與蘇離在酒坊相撞",
          characters: ["林淵", "蘇離(皇女)"],
          content: "十六歲的林淵被誤認為偷酒賊，蘇離替他解圍，兩人立下共赴京城的約定。"
        },
        {
          id: "3",
          year: 1029,
          era: "京城變亂",
          title: "皇宮夜宴火起，師尊背叛？",
          characters: ["林淵", "雲滄(師尊)", "蘇離(皇女)"],
          content: "宴席上黑衣死士突襲，林淵看見領頭者的劍法赫然是師門絕學「落霜訣」。"
        }
      ]
    };

    // Load local storage fallback
    function loadLocalCache() {
      const saved = localStorage.getItem("novel_timeline_data");
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch (e) { console.error("Error loading local storage:", e); }
      }
    }

    function saveLocalCache() {
      localStorage.setItem("novel_timeline_data", JSON.stringify(appData));
    }

    // --- Google Drive API Integration ---
    function initGIS() {
      if (window.google && window.google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: SCOPES,
          callback: async (resp) => {
            if (resp.error !== undefined) {
              alert("Google 授權失敗: " + resp.error);
              return;
            }
            accessToken = resp.access_token;
            updateSyncBadge("connecting", "正在連線 Google 雲端...");
            await setupDriveFolderAndFile();
          }
        });
      }
    }

    function handleAuthClick() {
      if (!tokenClient) {
        initGIS();
      }
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        alert("Google 登入套件載入中，請稍候重試或確認網路正常。");
      }
    }

    async function setupDriveFolderAndFile() {
      try {
        // 1. Search for folder
        const qFolder = `mimeType = 'application/vnd.google-apps.folder' and name = '${FOLDER_NAME}' and trashed = false`;
        const folderRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFolder)}`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        }).then(r => r.json());

        if (folderRes.files && folderRes.files.length > 0) {
          driveFolderId = folderRes.files[0].id;
        } else {
          // Create Folder
          const createFolderRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: FOLDER_NAME,
              mimeType: 'application/vnd.google-apps.folder'
            })
          }).then(r => r.json());
          driveFolderId = createFolderRes.id;
        }

        // 2. Search for timeline data file in folder
        const qFile = `name = '${FILE_NAME}' and '${driveFolderId}' in parents and trashed = false`;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFile)}`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        }).then(r => r.json());

        if (fileRes.files && fileRes.files.length > 0) {
          driveFileId = fileRes.files[0].id;
          // Download existing data from Drive
          const dataRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          }).then(r => r.json());
          
          if (dataRes && dataRes.fragments) {
            appData = dataRes;
            saveLocalCache();
          }
        } else {
          // Create file in folder
          const metaRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: FILE_NAME,
              parents: [driveFolderId],
              mimeType: 'application/json'
            })
          }).then(r => r.json());
          driveFileId = metaRes.id;
          await syncToCloud(false);
        }

        updateSyncBadge("synced", "已連線 Google 雲端 (雙向同步中)");
        document.getElementById("googleAuthBtn").classList.add("hidden");
        renderAll();
      } catch (err) {
        console.error(err);
        updateSyncBadge("error", "雲端連線失敗，請檢查網路");
      }
    }

    async function syncToCloud(showToast = false) {
      saveLocalCache();
      if (!accessToken || !driveFileId) {
        if (showToast) alert("已儲存於瀏覽器本機！(若需雲端同步請點登入 Google)");
        return;
      }

      updateSyncBadge("syncing", "同步上傳中...");
      try {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(appData)
        });
        updateSyncBadge("synced", `已同步至雲端 (${new Date().toLocaleTimeString()})`);
        if (showToast) alert("已成功同步儲存到 Google 雲端！");
      } catch (e) {
        console.error(e);
        updateSyncBadge("error", "同步失敗");
      }
    }

    function updateSyncBadge(type, text) {
      const badge = document.getElementById("cloudStatusBadge");
      const label = document.getElementById("cloudStatusText");
      label.innerText = text;

      if (type === "synced") {
        badge.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-500 border border-emerald-500/20";
        badge.querySelector("span").className = "w-2 h-2 rounded-full bg-emerald-500";
      } else if (type === "syncing" || type === "connecting") {
        badge.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-500/10 text-blue-500 border border-blue-500/20";
        badge.querySelector("span").className = "w-2 h-2 rounded-full bg-blue-500 animate-ping";
      } else if (type === "error") {
        badge.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-red-500/10 text-red-500 border border-red-500/20";
        badge.querySelector("span").className = "w-2 h-2 rounded-full bg-red-500";
      }
    }

    // --- UI Rendering ---
    function renderCharacters() {
      const list = document.getElementById("characterList");
      list.innerHTML = Object.keys(appData.characters).map(name => {
        const c = appData.characters[name];
        return `<span class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)]">
          ${name} <span class="text-[var(--muted-foreground)]">(${c.birthYear ? `生於 ${c.birthYear}年` : '未知'})</span>
        </span>`;
      }).join('');

      const pov = document.getElementById("povFilter");
      const currentPov = pov.value;
      pov.innerHTML = `<option value="ALL">全域時間線 (所有碎片)</option>` + 
        Object.keys(appData.characters).map(n => `<option value="${n}" ${currentPov === n ? 'selected' : ''}>只看「${n}」的時間線</option>`).join('');
    }

    function renderTimeline() {
      const pov = document.getElementById("povFilter").value;
      const container = document.getElementById("timelineList");

      // Sort chronological
      appData.fragments.sort((a, b) => a.year - b.year);

      const items = pov === "ALL" 
        ? appData.fragments 
        : appData.fragments.filter(f => f.characters.some(c => c.includes(pov)));

      if (items.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-sm text-[var(--muted-foreground)]">目前沒有此角色的靈感碎片。</div>`;
        return;
      }

      container.innerHTML = items.map((frag, idx) => {
        let intervalHtml = "";
        if (idx > 0) {
          const diff = frag.year - items[idx - 1].year;
          intervalHtml = `
            <div class="flex items-center gap-2 pl-12 md:pl-16 py-1 text-xs text-[var(--muted-foreground)] font-mono">
              <span class="inline-block w-2 h-2 border-l border-b border-[var(--border)]"></span>
              <span>相隔 ${diff} 年 (${items[idx - 1].year} ➔ ${frag.year})</span>
            </div>
          `;
        }

        const ageBadges = frag.characters.map(charName => {
          const matched = Object.keys(appData.characters).find(k => charName.includes(k) || k.includes(charName));
          if (matched && appData.characters[matched].birthYear) {
            const age = frag.year - appData.characters[matched].birthYear;
            const isDeadOrNotBorn = age < 0;
            return `
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium ${isDeadOrNotBorn ? 'bg-red-500/10 text-red-500 border border-red-500/20 font-bold' : 'bg-[var(--secondary)] text-[var(--secondary-foreground)]'}">
                ${charName}: ${isDeadOrNotBorn ? '尚未出生 (吃書警報!)' : `${age} 歲`}
              </span>
            `;
          }
          return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-[var(--secondary)] text-[var(--secondary-foreground)]">${charName}</span>`;
        }).join(' ');

        return `
          ${intervalHtml}
          <div class="flex items-start gap-3 md:gap-5 group">
            <div class="flex-shrink-0 w-12 md:w-16 pt-1 text-right font-mono font-bold text-xs text-[var(--foreground)]">
              ${frag.year}
            </div>

            <div class="relative flex items-center justify-center flex-shrink-0 mt-2 z-10">
              <div class="w-3.5 h-3.5 rounded-full bg-[var(--primary)] ring-4 ring-[var(--card)]"></div>
            </div>

            <div class="flex-grow bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-xs hover:border-[var(--primary)] transition">
              <div class="flex items-start justify-between gap-2 mb-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="font-bold text-sm md:text-base text-[var(--foreground)]">${frag.title}</h3>
                  ${frag.era ? `<span class="text-xs px-2 py-0.5 rounded bg-[var(--accent)] text-[var(--muted-foreground)]">${frag.era}</span>` : ''}
                </div>
                <button onclick="deleteFragment('${frag.id}')" class="text-xs text-red-400 hover:text-red-600 transition">刪除</button>
              </div>

              <p class="text-xs md:text-sm text-[var(--muted-foreground)] leading-relaxed mb-3">
                ${frag.content}
              </p>

              <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-[var(--border)]">
                <span class="text-xs text-[var(--muted-foreground)] mr-1">人物與年齡：</span>
                ${ageBadges}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderCharacters();
      renderTimeline();
    }

    // --- Modal Actions ---
    function openAddModal() {
      document.getElementById("fragTitle").value = "";
      document.getElementById("fragYear").value = "";
      document.getElementById("fragEra").value = "";
      document.getElementById("fragCharacters").value = "";
      document.getElementById("fragContent").value = "";
      document.getElementById("fragmentModal").classList.remove("hidden");
      document.getElementById("fragmentModal").classList.add("flex");
    }

    function openCharModal() {
      const container = document.getElementById("charInputsList");
      container.innerHTML = Object.keys(appData.characters).map(name => {
        const c = appData.characters[name];
        return `
          <div class="flex items-center justify-between gap-2 bg-[var(--background)] p-2 rounded-lg border border-[var(--border)]">
            <span class="text-xs font-semibold text-[var(--foreground)]">${name}</span>
            <div class="flex items-center gap-2">
              <span class="text-xs text-[var(--muted-foreground)]">出生年份:</span>
              <input type="number" value="${c.birthYear || ''}" onchange="updateCharBirth('${name}', this.value)" class="w-20 bg-[var(--card)] border border-[var(--border)] rounded px-2 py-1 text-xs">
              <button onclick="deleteChar('${name}')" class="text-xs text-red-400 hover:text-red-600">✕</button>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById("charModal").classList.remove("hidden");
      document.getElementById("charModal").classList.add("flex");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
      document.getElementById(id).classList.remove("flex");
    }

    function saveFragment() {
      const title = document.getElementById("fragTitle").value.trim();
      const year = parseInt(document.getElementById("fragYear").value);
      const era = document.getElementById("fragEra").value.trim();
      const chars = document.getElementById("fragCharacters").value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      const content = document.getElementById("fragContent").value.trim();

      if (!title || isNaN(year)) {
        alert("請輸入標題與發生年份！");
        return;
      }

      appData.fragments.push({
        id: Date.now().toString(),
        title,
        year,
        era,
        characters: chars.length ? chars : ["主角"],
        content: content || "無額外備註"
      });

      closeModal("fragmentModal");
      renderAll();
      syncToCloud(false);
    }

    function deleteFragment(id) {
      if (confirm("確定要刪除這張碎片嗎？")) {
        appData.fragments = appData.fragments.filter(f => f.id !== id);
        renderAll();
        syncToCloud(false);
      }
    }

    function addNewChar() {
      const name = document.getElementById("newCharName").value.trim();
      const birth = parseInt(document.getElementById("newCharBirth").value);
      if (!name) return;
      appData.characters[name] = { birthYear: isNaN(birth) ? null : birth };
      document.getElementById("newCharName").value = "";
      document.getElementById("newCharBirth").value = "";
      openCharModal();
      renderAll();
      syncToCloud(false);
    }

    function updateCharBirth(name, val) {
      const birth = parseInt(val);
      appData.characters[name].birthYear = isNaN(birth) ? null : birth;
      renderAll();
      syncToCloud(false);
    }

    function deleteChar(name) {
      delete appData.characters[name];
      openCharModal();
      renderAll();
      syncToCloud(false);
    }

    function filterByPOV() {
      renderTimeline();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `小說時序庫備份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    // Startup
    loadLocalCache();
    renderAll();
    window.onload = () => {
      initGIS();
    };
  </script>
</body>
</html>
